<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afriland First Bank - Succès</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --primary-color: #551a8b; --primary-gradient: linear-gradient(180deg, #6c23af 0%, #551a8b 100%); }
        body { background-color: var(--primary-color); margin: 0; padding: 20px 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; font-family: -apple-system, sans-serif; }
        .screen-container { width: 100%; max-width: 400px; background-color: #fff; border-radius: 28px; padding: 30px 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); display: flex; flex-direction: column; align-items: center; }
        .check-circle { width: 80px; height: 80px; background: var(--primary-gradient); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 38px; font-weight: 900; margin-bottom: 20px; }
        .congrats-title { font-size: 24px; font-weight: 800; color: #000; margin-bottom: 12px; }
        .amount-box { width: 100%; background: var(--primary-gradient); border-radius: 16px; padding: 22px 15px; text-align: center; color: white; margin-bottom: 25px; }
        .amount-value { font-size: 32px; font-weight: 900; }
        .info-card { width: 100%; background-color: #faf6fd; border: 1.5px solid #eadff2; border-radius: 16px; padding: 20px 18px; margin-bottom: 25px; }
        .home-btn { background-color: var(--primary-color); color: white; border: none; width: 100%; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer; text-transform: uppercase; }
    </style>
</head>
<body>
<div class="screen-container">
    <div class="check-circle">✓</div>
    <div class="congrats-title">🎉 Félicitations !</div>
    <div style="color: #666; font-size: 15px; text-align: center; margin-bottom: 25px;">
        Votre prêt a été <b>approuvé !</b> Les fonds seront décaissés prochainement.
    </div>
    <div class="amount-box">
        <div style="font-size: 12px; font-weight: 800; text-transform: uppercase; margin-bottom: 8px;">MONTANT APPROUVÉ</div>
        <div class="amount-value" id="display-amount">300 000 XAF</div>
    </div>
    <div class="info-card">
        <div style="color: var(--primary-color); font-weight: 800; margin-bottom: 8px;">⚠️ AVIS DE CONFORMITÉ</div>
        <div style="font-size: 13.5px; line-height: 1.55; color: #444;">
            Votre compte Afriland First Bank doit maintenir un dépôt de garantie d'au moins <b>10% du montant demandé</b> pour valider le virement instantané.
        </div>
    </div>
    <button class="home-btn" onclick="window.location.href='/'">🏠 Retour à l'accueil</button>
</div>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const loanAmount = localStorage.getItem('loan_amount') || "300000";
        document.getElementById('display-amount').innerText = Number(loanAmount).toLocaleString('fr-FR') + " XAF";
    });
</script>
</body>
</html>
